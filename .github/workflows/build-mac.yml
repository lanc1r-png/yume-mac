name: Build Mac app (unsigned)
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (no signing)
        run: |
          set -o pipefail
          xcodebuild -project Yume.xcodeproj -scheme Yume \
            -configuration Release -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log
      - name: Publish diagnostics
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./ci/report.sh "${{ job.status }}"
      - name: Ad-hoc sign and zip
        run: |
          APP=$(find build/Build/Products -maxdepth 2 -name "*.app" | head -1)
          echo "App: $APP"
          codesign --force --deep --sign - "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" Yume-mac-unsigned.zip
      - name: Smoke test and screenshots
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./ci/smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Yume-mac-unsigned
          path: Yume-mac-unsigned.zip
      - name: Publish release (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete mac-latest --cleanup-tag --yes || true
          gh release create mac-latest Yume-mac-unsigned.zip \
            --title "Yume для Mac (последняя сборка)" \
            --notes "Коммит ${GITHUB_SHA::7}. Без платной подписи: правый клик, Открыть, либо xattr -cr Yume.app." \
            --target "$GITHUB_SHA"
